# 消融实验: S4C + Ray Transformer (无 DHS 自适应采样)
# 对比链: S4C / S4C+RT / S4C+DHS / S4C+DHS+RT
# 本配置 = 基线(7b81b11) + 关闭 adaptive_sampling，保留 ray_attention
# 训练起点: 从 S4C(176000) 权重出发 (即 BTS 预训练再经 S4C 训练的 checkpoint)
#   通过 resume_from + reset_training_state=true 只加载模型权重，
#   optimizer / lr_scheduler / iteration 计数全部从头开始。
#   (原 use_backbone 机制硬编码 out/kitti_360/pretrained 路径 -> /mnt/disk1，
#    本机不可达，改用本地可访问的 S4C checkpoint)

defaults:
    - default
    - data: kitti_360
    - _self_

name: "s4c_rt_no_dhs"
model: "bts"
output_path: "out/s4c_rt"

num_epochs: 60
batch_size: 8
accumulation_steps: 2

resume_from: /home/lmh/s4c/out/training_checkpoint_176000.pt
reset_training_state: true
grad_clip_max_norm: 1.0


segmentation_mode: 'panoptic_deeplab'

save_best:
    metrics:
        - metric: a1_lidar
          sign: 1
        - metric: abs_rel_lidar
          sign: -1
        - metric: a1
          sign: 1
        - metric: seg_acc
          sign: 1

data:
    data_fc: 2
    image_size: [192, 640]
    color_aug: true
    is_preprocessed: true
    fisheye_rotation: [0, -15]
    depth_mode: "offline"

model_conf:
    arch: "BTSNet"
    use_code: true
    prediction_mode: default

    code:
        num_freqs: 6
        freq_factor: 1.5
        include_input: true

    encoder:
        type: "monodepth2"
        freeze: false
        pretrained: true
        resnet_layers: 50
        num_ch_dec: [32,32,64,128,256]
        d_out: 64

    # ========== 消融: 关闭 DHS 自适应采样，使用均匀采样 ==========
    adaptive_sampling: false  # ← 关闭 DHS
    # n_surface_samples: 32   # 不使用
    # n_global_samples: 32    # 不使用
    # absrel_prior: 0.12
    # min_thickness: 0.5
    # conf_epsilon: 0.1
    # conf_threshold: 0.2

    # Ray Transformer (Sigma Corrector) — 保留
    ray_attention:
        enabled: true
        d_model: 32
        n_head: 4
        d_ffn: 64
        use_ffn: true

    mlp_coarse:
        type : "resnet"
        n_blocks : 0
        d_hidden : 64

    mlp_fine:
        type : "empty"
        n_blocks : 1
        d_hidden : 128

    mlp_segmentation:
        type: "resnet"
        n_blocks: 0
        d_hidden: 64

    z_near: 3
    z_far: 80
    inv_z: true

    n_frames_encoder: 1
    n_frames_render: 2
    frame_sample_mode: kitti360-mono

    sample_mode: patch
    patch_size: 8
    ray_batch_size: 4096

    flip_augmentation: true

    learn_empty: false
    code_mode: z

loss:
    criterion: "l1+ssim"
    invalid_policy: weight_guided
    lambda_edge_aware_smoothness: 0.001
    lambda_segmentation: 0.02
    lambda_density_entropy: 0

    segmentation_class_weights:
        0: 1 # 'road'
        1: 10 # 'sidewalk'
        2: 1 # 'building'
        3: 1 # 'wall'
        4: 1 # 'fence'
        5: 10 # 'pole'
        6: 5 # 'traffic light'
        7: 10 # 'traffic sign'
        8: 1 # 'vegetation'
        9: 1 # 'terrain'
        10: 1 # 'sky'
        11: 5 # 'person'
        12: 1 # 'rider'
        13: 1 # 'car'
        14: 1 # 'truck'
        15: 1 # 'bus'
        16: 1 # 'train'
        17: 1 # 'motorcycle'
        18: 1 # 'bicycle'

scheduler:
    type: step
    step_size: 120000
    gamma: 0.1

renderer:
    n_coarse : 64
    n_fine : 0
    n_fine_depth : 0
    depth_std : 1.0
    sched : []
    white_bkgd : false
    lindisp: true
    hard_alpha_cap: true
    eval_batch_size: 200000
